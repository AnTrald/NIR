# Дополнение только для запуска backend-тестов через compose run.
# Отдельное имя образа сохраняет production-образ backend неизменным.
services:
  backend:
    image: web-notebook-backend-tests:local
    build:
      target: test
    environment:
      WEBNB_CONTRACT_ROOT: /
    volumes:
      - ./contracts:/contracts:ro
      - ./schemas:/schemas:ro
    command: ["pytest", "-q"]
