[project]
name = "web-notebook-backend"
version = "0.1.0"
description = "API и хранение документов Web Notebook"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "uvicorn==0.54.0",
  "argon2-cffi==25.1.0",
  "email-validator==2.4.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "httpx==0.28.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: проверка настоящего PostgreSQL"]
